<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Qasir Sablon Gelas - Operator</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest-operator.json">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, Roboto, Segoe UI, Arial, sans-serif; background: #f4f4f4; color: #111; overscroll-behavior: none; }
  body { background: #ececec; }
  #app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 0 1px #c4c4c4; }
  .bar { flex: none; background: #000; color: #fff; display: flex; align-items: center; min-height: calc(56px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); padding: env(safe-area-inset-top, 0px) 8px 0; }
  .bar .jdl { flex: 1; font-size: 19px; font-weight: 600; padding-left: 8px; }
  .bar button { background: none; border: 0; color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .bar button svg { width: 24px; height: 24px; fill: currentColor; }
  .cari { padding: 10px 14px; border-bottom: 2px solid #111; flex: none; }
  .cari input { width: 100%; border: 0; border-bottom: 2px solid #999; padding: 8px 2px; font-size: 16px; font-family: inherit; outline: none; }
  .isi { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
  .kosong { padding: 40px 20px; text-align: center; color: #888; font-size: 15px; }
  .nrow { display: flex; gap: 14px; padding: 14px 16px 12px; border-bottom: 1px solid #d9d9d9; align-items: center; }
  .nrow .av { width: 44px; height: 44px; border-radius: 50%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
  .nrow .nb { flex: 1; min-width: 0; }
  .nrow .l1 { display: flex; gap: 10px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .nrow .nm { font-size: 18px; color: #111; flex: none; max-width: 72%; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .nrow .inv { font-size: 14px; color: #7a7a7a; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .nrow .l2 { color: #8a8a8a; font-size: 16px; margin-top: 3px; }
  .nrow .items { margin-top: 6px; }
  .nrow .irow { display: flex; justify-content: space-between; padding: 3px 0; font-size: 15.5px; color: #333; }
  .nrow .irow .q { font-weight: 700; flex: none; margin-left: 10px; }
  .nrow .cat { font-size: 13.5px; color: #b45309; margin: 0 0 4px 0; font-style: italic; }
  .crow { display: flex; gap: 14px; padding: 13px 16px; border-bottom: 1px solid #dcdcdc; align-items: center; cursor: pointer; }
  .crow:active { background: #f3f3f3; }
  .crow .cb { flex: 1; min-width: 0; }
  .crow .c1 { font-size: 17px; display: flex; justify-content: space-between; gap: 10px; }
  .crow .c1 .r { font-weight: 700; white-space: nowrap; }
  .crow .c1 .r.min { color: #d32f2f; }
  .tabs { display: flex; flex: none; background: #000; }
  .tabs button { flex: 1; background: none; border: 0; color: #aaa; padding: 10px 4px calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 13px; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  .tabs button.on { color: #fff; }
  .tabs svg { width: 22px; height: 22px; fill: currentColor; }
  .setup { padding: 24px 20px; }
  .setup h2 { font-size: 19px; margin: 0 0 6px; }
  .setup p { color: #666; font-size: 14.5px; line-height: 1.5; }
  .setup label { display: block; font-size: 13.5px; color: #555; margin: 16px 0 4px; }
  .setup input { width: 100%; padding: 11px 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
  .setup button.simpan { margin-top: 20px; width: 100%; padding: 13px; background: #000; color: #fff; border: 0; border-radius: 8px; font-size: 15.5px; font-weight: 600; cursor: pointer; }
  .setup .err { color: #d32f2f; font-size: 13.5px; margin-top: 10px; min-height: 18px; }
  .status { flex: none; text-align: center; font-size: 12.5px; padding: 5px; color: #666; background: #f0f0f0; }
  .status.err { color: #b91c1c; background: #fde8e8; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #222; color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: 85vw; text-align: center; }
  #l_peny { position: fixed; inset: 0; max-width: 520px; margin: 0 auto; background: #fff; display: none; flex-direction: column; z-index: 20; }
  #l_peny.on { display: flex; }
  .form { padding: 16px; overflow: auto; flex: 1; }
  .form label { display: block; font-size: 13.5px; color: #555; margin: 16px 0 4px; }
  .form label:first-child { margin-top: 0; }
  .form input, .form select { width: 100%; padding: 11px 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; background: #fff; }
  .form .info { background: #f3f3f3; border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #444; }
  .form button.simpan { margin-top: 22px; width: 100%; padding: 13px; background: #000; color: #fff; border: 0; border-radius: 8px; font-size: 15.5px; font-weight: 600; cursor: pointer; }
  .form button.simpan:disabled { opacity: .5; }
  .form .err { color: #d32f2f; font-size: 13.5px; margin-top: 10px; min-height: 18px; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="l_setup" class="setup" style="display:none">
    <h2>Hubungkan ke Data Toko</h2>
    <p>Minta pemilik toko memberi <b>URL Apps Script</b> dan <b>Kode Operator</b> (bukan kode rahasia pemilik). Isi sekali saja di HP ini.</p>
    <label for="s_url">URL Apps Script</label>
    <input id="s_url" type="text" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off">
    <label for="s_kode">Kode Operator</label>
    <input id="s_kode" type="text" placeholder="Kode dari pemilik toko" autocomplete="off" autocapitalize="off">
    <button class="simpan" onclick="simpanSetup()">Hubungkan</button>
    <div class="err" id="s_err"></div>
  </div>
  <div id="l_main" style="display:none; flex:1; min-height:0; display:flex; flex-direction:column;">
    <div class="bar">
      <div class="jdl" id="judul">Pesanan</div>
      <button onclick="segarkan(true)" aria-label="Muat ulang"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
      <button onclick="bukaSetup()" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
    </div>
    <div class="status" id="status" style="display:none"></div>
    <div class="cari"><input id="cari" type="search" placeholder="Cari" autocomplete="off"></div>
    <div class="isi" id="isi"></div>
    <div class="tabs">
      <button class="tb on" data-t="pesanan" onclick="pindahTab('pesanan')">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>Pesanan</span>
      </button>
      <button class="tb" data-t="stok" onclick="pindahTab('stok')">
        <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zM18 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        <span>Stok</span>
      </button>
    </div>
  </div>
</div>
<div id="l_peny">
  <div class="bar"><button onclick="tutupPeny()" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button><div class="jdl">Catat Penyesuaian</div></div>
  <div class="form">
    <label>Nama Item</label>
    <div class="info" id="pn_nama">-</div>
    <label for="pn_arah">Arah</label>
    <select id="pn_arah">
      <option value="kurang">Stok Berkurang (rusak/hilang/kurang)</option>
      <option value="tambah">Stok Bertambah (koreksi lebih)</option>
    </select>
    <label for="pn_jml">Jumlah (pcs)</label>
    <input id="pn_jml" type="number" inputmode="numeric" min="0">
    <label for="pn_tgl">Tanggal</label>
    <input id="pn_tgl" type="date">
    <label for="pn_alasan">Alasan</label>
    <select id="pn_alasan">
      <option>Rusak</option><option>Hilang</option><option>Koreksi Hitung</option><option>Lainnya</option>
    </select>
    <label for="pn_cat">Catatan (Opsional)</label>
    <input id="pn_cat" autocomplete="off">
    <button class="simpan" id="pn_simpan" onclick="simpanPeny()">Simpan</button>
    <div class="err" id="pn_err"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const K_CFG = 'qsg_op_cfg', K_DATA = 'qsg_op_data', K_QUEUE = 'qsg_op_queue';
let CFG = null, DATA = { pesanan: [], stok: [] }, QUEUE = [], TAB = 'pesanan', WAKTU = null, sedangFlush = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (x) => new Intl.NumberFormat('id-ID').format(Number(x) || 0);
const ini = (nama) => { const t = String(nama || '').trim(); if (!t) return '?'; const a = t.slice(0, 2); return a.charAt(1) === ' ' ? a.charAt(0) : a; };
function tglDMY(s) { const t = String(s || '').slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(t) ? t.slice(8, 10) + '/' + t.slice(5, 7) + '/' + t.slice(0, 4) : t; }
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), ms || 3000); }

function muatCfg() { try { CFG = JSON.parse(localStorage.getItem(K_CFG) || 'null'); } catch (e) { CFG = null; } try { DATA = JSON.parse(localStorage.getItem(K_DATA) || 'null') || DATA; } catch (e) {} try { QUEUE = JSON.parse(localStorage.getItem(K_QUEUE) || '[]') || []; } catch (e) { QUEUE = []; } }
function simpanCfgLokal() { try { localStorage.setItem(K_CFG, JSON.stringify(CFG)); } catch (e) {} }
function simpanDataLokal() { try { localStorage.setItem(K_DATA, JSON.stringify(DATA)); } catch (e) {} }
function simpanQueueLokal() { try { localStorage.setItem(K_QUEUE, JSON.stringify(QUEUE)); } catch (e) {} }
function uid() { return 'op' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
// Tampilkan stok dgn seluruh penyesuaian yg masih menunggu terkirim ikut diperhitungkan (supaya layar tetap benar walau belum tersinkron).
function terapkanQueueOptimis() { QUEUE.forEach((q) => { const s = DATA.stok.find((x) => x.id === q.barangId); if (s) s.stok += q.jumlah; }); }

function bukaSetup() {
  $('l_main').style.display = 'none'; $('l_setup').style.display = 'block';
  $('s_url').value = (CFG && CFG.url) || ''; $('s_kode').value = (CFG && CFG.token) || ''; $('s_err').textContent = '';
}
function simpanSetup() {
  const url = $('s_url').value.trim(), token = $('s_kode').value.trim();
  if (!url || !token) { $('s_err').textContent = 'Isi URL dan Kode Operator.'; return; }
  CFG = { url, token }; simpanCfgLokal();
  $('l_setup').style.display = 'none'; $('l_main').style.display = 'flex';
  segarkan(true);
}
async function panggil(body) {
  const r = await fetch(CFG.url, { method: 'POST', body: JSON.stringify({ ...body, token: CFG.token }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Gagal mengambil data');
  return j;
}
function updateStatus(err, pesanErr) {
  const st = $('status'); st.style.display = ''; st.classList.toggle('err', !!err);
  const antre = QUEUE.length ? `${QUEUE.length} penyesuaian menunggu dikirim` : '';
  if (err) st.textContent = 'Gagal memuat: ' + pesanErr + (antre ? ' · ' + antre : '');
  else st.textContent = (WAKTU ? 'Data sampai ' + WAKTU.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '') + (antre ? (WAKTU ? ' · ' : '') + antre : '');
}
// Kirim semua penyesuaian yg masih tertunda (dibuat saat offline/gagal kirim). Berhenti begitu satu percobaan gagal - sisanya dicoba lagi nanti.
async function flushQueue() {
  if (sedangFlush || !QUEUE.length || !CFG) return;
  sedangFlush = true;
  while (QUEUE.length) {
    const q = QUEUE[0];
    try {
      const j = await panggil({ action: 'tambahPenyesuaian', id: q.id, barangId: q.barangId, tanggal: q.tanggal, jumlah: q.jumlah, alasan: q.alasan, catatan: q.catatan });
      QUEUE.shift(); simpanQueueLokal();
      if (j.data) { DATA = { pesanan: j.data.pesanan || [], stok: j.data.stok || [] }; WAKTU = new Date(); terapkanQueueOptimis(); simpanDataLokal(); }
      render(); updateStatus();
    } catch (e) { break; }   // masih gagal (offline dsb) - coba lagi lain kali, jangan buang dari antrean
  }
  sedangFlush = false;
}
async function segarkan(manual) {
  if (!CFG) { bukaSetup(); return; }
  await flushQueue();
  updateStatus(); $('status').textContent = 'Memuat data…';
  try {
    const j = await panggil({ action: 'dataOperator' });
    DATA = { pesanan: j.pesanan || [], stok: j.stok || [] }; WAKTU = new Date();
    terapkanQueueOptimis(); simpanDataLokal();
    updateStatus();
    render();
  } catch (e) {
    updateStatus(true, e.message + (manual ? '' : ' (menampilkan data terakhir)'));
    render();
  }
}
function pindahTab(t) {
  TAB = t; document.querySelectorAll('.tabs .tb').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  $('judul').textContent = t === 'pesanan' ? 'Pesanan' : 'Stok Gelas';
  $('cari').placeholder = t === 'pesanan' ? 'Cari nama pemesan atau item' : 'Cari nama item';
  $('cari').value = ''; render();
}
function render() {
  const q = $('cari').value.trim().toLowerCase();
  if (TAB === 'pesanan') {
    const arr = DATA.pesanan.filter((o) => !q || (o.pelanggan + ' ' + o.items.map((i) => i.nama + ' ' + (i.catatan || '')).join(' ')).toLowerCase().indexOf(q) >= 0);
    $('isi').innerHTML = arr.length ? arr.map((o) => `<div class="nrow"><div class="av">${esc(ini(o.pelanggan))}</div><div class="nb"><div class="l1"><span class="nm">${esc(o.pelanggan || 'CASH')}</span><span class="inv">${esc(o.invoice)}</span></div><div class="l2">${tglDMY(o.tanggal)}${o.jam ? ' ' + esc(o.jam) : ''}</div><div class="items">${o.items.map((i) => `<div class="irow"><span>${esc(i.nama)}</span><span class="q">${nf(i.jumlah)} ${esc(i.satuan)}</span></div>${i.catatan ? `<div class="cat">📝 ${esc(i.catatan)}</div>` : ''}`).join('')}</div></div></div>`).join('')
      : `<div class="kosong">${q ? 'Tidak ada pesanan yang cocok.' : 'Belum ada pesanan.'}</div>`;
  } else {
    const arr = DATA.stok.filter((s) => !q || s.nama.toLowerCase().indexOf(q) >= 0);
    $('isi').innerHTML = arr.length ? arr.map((s) => { const n = QUEUE.filter((x) => x.barangId === s.id).length; return `<div class="crow" onclick="bukaPeny('${s.id}')"><div class="cb"><div class="c1"><span>${esc(s.nama)}${n ? ` <small style="color:#b45309;font-weight:600">(${n} menunggu kirim)</small>` : ''}</span><span class="r${s.stok < 0 ? ' min' : ''}">${nf(s.stok)} ${esc(s.satuan)}</span></div></div></div>`; }).join('')
      : `<div class="kosong">${q ? 'Tidak ada item yang cocok.' : 'Belum ada item.'}</div>`;
  }
}
$('cari').addEventListener('input', () => { let t; clearTimeout(render._t); render._t = setTimeout(render, 120); });

let PN_ID = null;
function hariIni() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function bukaPeny(id) {
  const s = DATA.stok.find((x) => x.id === id); if (!s) return;
  PN_ID = id;
  $('pn_nama').textContent = `${s.nama} — stok saat ini ${nf(s.stok)} ${s.satuan}`;
  $('pn_arah').value = 'kurang'; $('pn_jml').value = ''; $('pn_tgl').value = hariIni(); $('pn_alasan').value = 'Rusak'; $('pn_cat').value = ''; $('pn_err').textContent = '';
  $('l_peny').classList.add('on');
}
function tutupPeny() { $('l_peny').classList.remove('on'); PN_ID = null; }
function simpanPeny() {
  const mag = Number($('pn_jml').value) || 0;
  if (!(mag > 0)) { $('pn_err').textContent = 'Isi jumlah lebih dari 0.'; return; }
  const s = DATA.stok.find((x) => x.id === PN_ID); if (!s) return;
  const jumlah = $('pn_arah').value === 'tambah' ? mag : -mag;
  QUEUE.push({ id: uid(), barangId: PN_ID, tanggal: $('pn_tgl').value || hariIni(), jumlah, alasan: $('pn_alasan').value, catatan: $('pn_cat').value.trim() });
  simpanQueueLokal();
  s.stok += jumlah;   // langsung terlihat di layar, tidak menunggu jawaban server
  tutupPeny(); render(); updateStatus();
  toast('Penyesuaian dicatat, mengirim…');
  flushQueue().then(() => { toast(QUEUE.length ? 'Belum ada sinyal - akan terkirim otomatis' : 'Penyesuaian terkirim ✓'); });
}

muatCfg();
terapkanQueueOptimis();
if (CFG && CFG.url && CFG.token) { $('l_main').style.display = 'flex'; render(); updateStatus(); segarkan(false); }
else bukaSetup();
window.addEventListener('online', () => segarkan(false));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw-operator.js', { scope: './operator.html' }).catch(() => {});
</script>
</body>
</html>
